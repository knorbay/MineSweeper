name: Build MineSweeper

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install nuitka ordered-set zstandard customtkinter pillow pygame-ce imageio

      - name: Build EXE
        shell: pwsh
        run: |
          python -m nuitka `
            --standalone `
            --windows-console-mode=disable `
            --enable-plugin=tk-inter `
            --include-data-dir=assets=assets `
            --include-data-files=highscores.json=highscores.json `
            --output-filename=MineSweeper.exe `
            --assume-yes-for-downloads `
            MineSweeper.py

      - name: Check output
        shell: pwsh
        run: |
          Write-Host "=== Nuitka output ==="
          Get-ChildItem -Recurse -File | Select-Object FullName

          Write-Host ""
          Write-Host "=== Checking executable ==="

          if (Test-Path "MineSweeper.dist\MineSweeper.exe") {
            Write-Host "MineSweeper.exe found."
          }
          else {
            Write-Error "MineSweeper.exe was not found in MineSweeper.dist."
            exit 1
          }

      - name: Zip Windows Build
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "MineSweeper.dist\*" `
            -DestinationPath "MineSweeper-Windows.zip"

      - name: Upload Windows Build
        uses: actions/upload-artifact@v4
        with:
          name: MineSweeper-Windows
          path: MineSweeper-Windows.zip

  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        shell: bash
        run: |
          python3 -m pip install --upgrade pip
          pip install nuitka ordered-set zstandard customtkinter pillow pygame-ce imageio

      - name: Build APP
        shell: bash
        run: |
          python3 -m nuitka \
            --standalone \
            --macos-create-app-bundle \
            --macos-app-icon=assets/icon.icns \
            --enable-plugin=tk-inter \
            --include-data-dir=assets=assets \
            --include-data-files=highscores.json=highscores.json \
            --output-filename=MineSweeper \
            MineSweeper.py

      - name: Check output
        shell: bash
        run: |
          echo "=== Nuitka output ==="
          find . -maxdepth 3 -type f

          echo ""
          echo "=== Checking application ==="

          if [ -d "MineSweeper.app" ]; then
            echo "MineSweeper.app found."
          else
            echo "MineSweeper.app was not found."
            exit 1
          fi

      - name: Zip macOS Build
        shell: bash
        run: |
          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            MineSweeper.app \
            MineSweeper-macOS.zip

      - name: Upload macOS Build
        uses: actions/upload-artifact@v4
        with:
          name: MineSweeper-macOS
          path: MineSweeper-macOS.zip
