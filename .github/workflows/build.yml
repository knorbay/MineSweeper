name: Build MineSweeper

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install nuitka ordered-set zstandard customtkinter pillow pygame-ce imageio

      - name: Build EXE
        shell: pwsh
        run: |
          python -m nuitka `
            --standalone `
            --windows-console-mode=disable `
            --windows-icon-from-ico=assets/icon.ico `
            --enable-plugin=tk-inter `
            --include-data-dir=assets=assets `
            --include-data-files=highscores.json=highscores.json `
            --output-filename=MineSweeper.exe `
            --assume-yes-for-downloads `
            MineSweeper.py

      - name: Check output
        shell: pwsh
        run: |
          Write-Host "=== Nuitka output ==="
          Get-ChildItem -Recurse -File | Select-Object FullName
          Write-Host ""
          Write-Host "=== Checking executable ==="
          if (Test-Path "MineSweeper.dist\MineSweeper.exe") {
            Write-Host "MineSweeper.exe found."
          }
          else {
            Write-Error "MineSweeper.exe was not found in MineSweeper.dist."
            exit 1
          }

      - name: Zip Windows Build
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "MineSweeper.dist\*" `
            -DestinationPath "MineSweeper-Windows.zip"

      - name: Upload Windows Build
        uses: actions/upload-artifact@v4
        with:
          name: MineSweeper-Windows
          path: MineSweeper-Windows.zip

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install system dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            patchelf \
            fuse \
            libfuse2 \
            desktop-file-utils \
            python3-tk \
            tk-dev \
            libsdl2-2.0-0 \
            libsdl2-image-2.0-0 \
            libsdl2-mixer-2.0-0 \
            libsdl2-ttf-2.0-0

      - name: Install python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install nuitka ordered-set zstandard customtkinter pillow pygame-ce imageio

      - name: Build binary
        shell: bash
        run: |
          python -m nuitka \
            --standalone \
            --enable-plugin=tk-inter \
            --include-data-dir=assets=assets \
            --include-data-files=highscores.json=highscores.json \
            --output-filename=MineSweeper \
            --assume-yes-for-downloads \
            MineSweeper.py

      - name: Check output
        shell: bash
        run: |
          echo "=== Nuitka output ==="
          find . -maxdepth 3 -type f
          echo ""
          echo "=== Checking executable ==="
          if [ -f "MineSweeper.dist/MineSweeper" ]; then
            echo "MineSweeper found."
          else
            echo "MineSweeper was not found in MineSweeper.dist."
            exit 1
          fi

      - name: Build AppImage (tüm distrolarla uyumlu)
        shell: bash
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage

          APPDIR="MineSweeper.AppDir"
          mkdir -p "$APPDIR/usr/bin"
          cp -r MineSweeper.dist/* "$APPDIR/usr/bin/"

          cat > "$APPDIR/MineSweeper.desktop" << 'EOF'
          [Desktop Entry]
          Name=MineSweeper
          Exec=MineSweeper
          Icon=icon
          Type=Application
          Categories=Game;
          EOF

          cp assets/icon.png "$APPDIR/icon.png"

          cat > "$APPDIR/AppRun" << 'EOF'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "${0}")")"
          exec "$HERE/usr/bin/MineSweeper" "$@"
          EOF
          chmod +x "$APPDIR/AppRun"

          ./appimagetool-x86_64.AppImage "$APPDIR" MineSweeper-Linux-x86_64.AppImage

      - name: Package Linux Build
        shell: bash
        run: |
          mkdir -p dist_output
          cp -r MineSweeper.dist dist_output/MineSweeper-standalone
          cp MineSweeper-Linux-x86_64.AppImage dist_output/
          cd dist_output
          zip -r ../MineSweeper-Linux.zip .

      - name: Upload Linux Build
        uses: actions/upload-artifact@v4
        with:
          name: MineSweeper-Linux
          path: MineSweeper-Linux.zip
