```yaml
name: Build MineSweeper

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nuitka ordered-set zstandard customtkinter pillow pygame imageio

      - name: Build EXE
        shell: pwsh
        run: |
          python -m nuitka `
            --standalone `
            --windows-console-mode=disable `
            --enable-plugin=tk-inter `
            --include-data-dir=assets=assets `
            --include-data-files=highscores.json=highscores.json `
            --output-filename=MineSweeper `
            --assume-yes-for-downloads `
            MineSweeper.py
      - name: Check output
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -File | Select-Object FullName
            - name: Zip Windows Build
              shell: pwsh
              run: |
                Compress-Archive -Path MineSweeper.dist\* -DestinationPath MineSweeper-Windows.zip
      
            - uses: actions/upload-artifact@v4
              with:
                name: MineSweeper-Windows
                path: MineSweeper-Windows.zip

  build-macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install nuitka ordered-set zstandard customtkinter pillow pygame imageio

      - name: Build APP
        run: |
          python3 -m nuitka \
            --standalone \
            --macos-create-app-bundle \
            --macos-app-icon=assets/icon.icns \
            --enable-plugin=tk-inter \
            --include-data-dir=assets=assets \
            --include-data-files=highscores.json=highscores.json \
            --output-filename=MineSweeper \
            MineSweeper.py

      - name: Zip macOS Build
        run: |
          ditto -c -k --sequesterRsrc --keepParent MineSweeper.app MineSweeper-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: MineSweeper-macOS
          path: MineSweeper-macOS.zip
```
